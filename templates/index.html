<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Titanic Survival Predictor</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <h1>🚢 Titanic Survival Predictor</h1>
        <p>Will this passenger survive the disaster?</p>

        <form id="predictionForm">
            <label>Passenger Class (1 = Upper, 2 = Middle, 3 = Lower)</label>
            <select id="Pclass" name="Pclass">
                <option value="1">1st Class</option>
                <option value="2">2nd Class</option>
                <option value="3">3rd Class</option>
            </select>

            <label>Gender</label>
            <select id="Sex" name="Sex">
                <option value="male">Male</option>
                <option value="female">Female</option>
            </select>

            <label>Age</label>
            <input type="number" id="Age" name="Age" step="0.1" required>

            <label>Number of Siblings / Spouses Aboard</label>
            <input type="number" id="SibSp" name="SibSp" value="0" min="0" required>

            <label>Number of Parents / Children Aboard</label>
            <input type="number" id="Parch" name="Parch" value="0" min="0" required>

            <label>Fare Paid</label>
            <input type="number" id="Fare" name="Fare" step="0.01" required>

            <label>Port of Embarkation</label>
            <select id="Embarked" name="Embarked">
                <option value="C">Cherbourg</option>
                <option value="Q">Queenstown</option>
                <option value="S">Southampton</option>
            </select>

            <button type="submit">🔮 Predict Survival</button>
        </form>

        <div id="result"></div>
    </div>

    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
